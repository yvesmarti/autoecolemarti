<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Panneaux – Auto-École Marti</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="panneaux_data.js"></script>
  <style>
    /* ── VARIABLES ── */
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2e3245;
      --accent:    #e63946;
      --accent2:   #457b9d;
      --gold:      #f4d03f;
      --green:     #2ecc71;
      --red:       #e74c3c;
      --text:      #e8eaf0;
      --muted:     #8b8fa8;
      --radius:    14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── HEADER ── */
    header {
      width: 100%;
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header .logo-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    header .logo-text span { color: var(--accent); }
    header .badge {
      margin-left: auto;
      background: var(--accent);
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── CONTAINER ── */
    .container {
      width: 100%;
      max-width: 760px;
      padding: 40px 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ── PROGRESS ── */
    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .progress-bar {
      height: 5px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      border-radius: 99px;
      transition: width 0.5s ease;
    }

    /* ── SCORE ── */
    .scoreboard {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    .score-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .score-pill .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .score-pill.correct .dot { background: var(--green); }
    .score-pill.wrong   .dot { background: var(--red); }

    /* ── CATEGORY TAG ── */
    .cat-tag {
      display: inline-block;
      background: var(--border);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 6px;
    }

    /* ── QUESTION CARD ── */
    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      animation: fadeUp 0.35s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .question-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ── SIGN IMAGE ── */
    .sign-wrapper {
      width: 180px;
      height: 180px;
      background: #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      padding: 12px;
    }
    .sign-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .sign-code {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.9rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    /* ── ANSWERS GRID ── */
    .answers-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .answer-btn {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      line-height: 1.35;
      transition: border-color 0.2s, background 0.2s, transform 0.1s;
      position: relative;
    }
    .answer-btn:hover:not(:disabled) {
      border-color: var(--accent2);
      background: rgba(69,123,157,0.12);
      transform: translateY(-2px);
    }
    .answer-btn:active:not(:disabled) { transform: translateY(0); }

    .answer-btn.correct {
      border-color: var(--green);
      background: rgba(46,204,113,0.12);
    }
    .answer-btn.wrong {
      border-color: var(--red);
      background: rgba(231,76,60,0.1);
      opacity: 0.7;
    }
    .answer-btn:disabled { cursor: default; }

    .answer-letter {
      display: inline-block;
      width: 24px; height: 24px;
      background: var(--border);
      border-radius: 6px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      line-height: 24px;
      text-align: center;
      margin-right: 10px;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .answer-btn.correct .answer-letter { background: var(--green); color: #fff; }
    .answer-btn.wrong   .answer-letter { background: var(--red);   color: #fff; }

    /* ── FEEDBACK ── */
    .feedback {
      width: 100%;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 500;
      display: none;
      line-height: 1.5;
    }
    .feedback.show { display: block; }
    .feedback.correct {
      background: rgba(46,204,113,0.12);
      border: 1px solid var(--green);
      color: var(--green);
    }
    .feedback.wrong {
      background: rgba(231,76,60,0.1);
      border: 1px solid var(--red);
      color: #ff8080;
    }
    .feedback strong { color: #fff; }

    /* ── NEXT BUTTON ── */
    .btn-next {
      display: none;
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 30px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-next:hover  { background: #c0303a; transform: translateY(-2px); }
    .btn-next:active { transform: translateY(0); }
    .btn-next.show   { display: inline-block; }

    /* ── RESULTS SCREEN ── */
    .results-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      text-align: center;
      animation: fadeUp 0.5s ease;
    }
    .results-screen.show { display: flex; }

    .results-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2.4rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .results-title span { color: var(--accent); }

    .results-circle {
      width: 140px; height: 140px;
      border-radius: 50%;
      border: 5px solid var(--accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      box-shadow: 0 0 40px rgba(230,57,70,0.3);
    }
    .results-circle .big-score {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
    }
    .results-circle .out-of {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .results-message {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 380px;
      line-height: 1.6;
    }

    .btn-restart {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 16px 40px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-restart:hover  { background: #c0303a; transform: translateY(-2px); }
    .btn-restart:active { transform: translateY(0); }

    /* ── RESPONSIVE ── */
    @media (max-width: 520px) {
      .answers-grid { grid-template-columns: 1fr; }
      .sign-wrapper { width: 140px; height: 140px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-text">Auto-École <span>Marti</span></div>
  <div class="badge">Quiz Panneaux</div>
</header>

<div class="container">

  <!-- PROGRESS + SCORE -->
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="q-label">Question 1 / 10</span>
      <span id="q-category"></span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="scoreboard">
    <div class="score-pill correct"><div class="dot"></div><span id="score-correct">0</span> correctes</div>
    <div class="score-pill wrong"><div class="dot"></div><span id="score-wrong">0</span> erreurs</div>
  </div>

  <!-- QUESTION CARD -->
  <div class="question-card" id="question-card">
    <div class="question-title">Quel est ce panneau ?</div>

    <div class="sign-wrapper">
      <img id="sign-img" src="" alt="Panneau de signalisation" />
    </div>
    <div class="sign-code" id="sign-code"></div>

    <div class="answers-grid" id="answers-grid"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">Question suivante →</button>
  </div>

  <!-- RESULTS -->
  <div class="results-screen" id="results-screen">
    <div class="results-title">Résultats <span>finaux</span></div>
    <div class="results-circle">
      <div class="big-score" id="final-score">0</div>
      <div class="out-of" id="final-out-of">/ 10</div>
    </div>
    <div class="results-message" id="results-message"></div>
    <button class="btn-restart" onclick="startQuiz()">Recommencer le quiz</button>
  </div>

</div>

<script>
// ╔══════════════════════════════════════════════════════════════════╗
// ║  CONFIGURATION                                                   ║
// ║  Modifiez IMAGE_BASE_PATH pour pointer vers votre dossier SVG   ║
// ╚══════════════════════════════════════════════════════════════════╝
const IMAGE_BASE_PATH = "./panneaux/";   // ex: "/images/panneaux/" ou "https://autoecolemarti.fr/panneaux/"
const TOTAL_QUESTIONS  = 10;
const CHOICES_PER_Q    = 4;

// panneauxData est chargé depuis panneaux_data.js (balise <script> dans le <head>)

// ── ÉTAT DU QUIZ ──────────────────────────────────────────────────────
let questions    = [];
let currentIndex = 0;
let scoreOk      = 0;
let scoreKo      = 0;
let answered     = false;

// ── UTILITAIRES ───────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getCategoryLabel(cat) {
  const labels = {
    danger:        "⚠️ Danger",
    priorite:      "🔺 Priorité",
    interdiction:  "🚫 Interdiction",
    obligation:    "🔵 Obligation",
    indication:    "🔵 Indication",
    service:       "🛎️ Service",
    localisation:  "📍 Localisation",
    fin_obligation:"⚪ Fin d'obligation",
    chantier:      "🚧 Chantier",
  };
  return labels[cat] || cat;
}

function getDistractors(correct) {
  // Cherche dans la même catégorie en priorité, puis dans le même type, sinon autre
  let pool = panneauxData.filter(p =>
    p.code !== correct.code &&
    p.categorie === correct.categorie
  );
  if (pool.length < CHOICES_PER_Q - 1) {
    pool = panneauxData.filter(p => p.code !== correct.code);
  }
  return shuffle(pool).slice(0, CHOICES_PER_Q - 1);
}

// ── DÉMARRAGE ─────────────────────────────────────────────────────────
function startQuiz() {
  // On ne garde que les panneaux dont le SVG existe réellement (filtré au premier run)
  const pool   = typeof availablePanneaux !== 'undefined' ? availablePanneaux : panneauxData;
  questions    = shuffle(pool).slice(0, Math.min(TOTAL_QUESTIONS, pool.length));
  currentIndex = 0;
  scoreOk      = 0;
  scoreKo      = 0;

  document.getElementById("results-screen").classList.remove("show");
  document.getElementById("question-card").style.display = "flex";
  document.getElementById("progress-wrap") && null;

  updateScoreboard();
  renderQuestion();
}

// ── RENDU QUESTION ────────────────────────────────────────────────────
function renderQuestion() {
  answered = false;
  const q = questions[currentIndex];

  // Progress
  const pct = (currentIndex / TOTAL_QUESTIONS) * 100;
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("q-label").textContent = `Question ${currentIndex + 1} / ${TOTAL_QUESTIONS}`;
  document.getElementById("q-category").textContent = getCategoryLabel(q.categorie);

  // Image
  const img = document.getElementById("sign-img");
  img.onerror = function() {
    // Si le SVG est manquant, on passe à la question suivante sans compter
    questions.splice(currentIndex, 1);
    if (questions.length === 0) { showResults(); return; }
    if (currentIndex >= questions.length) currentIndex = 0;
    renderQuestion();
  };
  img.src = IMAGE_BASE_PATH + q.code + ".svg";
  img.alt = "Panneau " + q.code;
  document.getElementById("sign-code").textContent = "Code : " + q.code;

  // Choix (bonne réponse + 3 distracteurs, mélangés)
  const distractors = getDistractors(q);
  const choices = shuffle([q, ...distractors]);

  const grid = document.getElementById("answers-grid");
  grid.innerHTML = "";
  const letters = ["A", "B", "C", "D"];

  choices.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "answer-btn";
    btn.innerHTML = `<span class="answer-letter">${letters[i]}</span>${choice.nom}`;
    btn.dataset.code = choice.code;
    btn.addEventListener("click", () => handleAnswer(btn, choice.code === q.code, q));
    grid.appendChild(btn);
  });

  // Reset feedback / bouton
  const fb = document.getElementById("feedback");
  fb.className = "feedback";
  fb.textContent = "";

  document.getElementById("btn-next").classList.remove("show");

  // Animation de la carte
  const card = document.getElementById("question-card");
  card.style.animation = "none";
  requestAnimationFrame(() => { card.style.animation = ""; });
}

// ── GESTION RÉPONSE ───────────────────────────────────────────────────
function handleAnswer(btn, isCorrect, panneau) {
  if (answered) return;
  answered = true;

  const allBtns = document.querySelectorAll(".answer-btn");
  allBtns.forEach(b => {
    b.disabled = true;
    if (b.dataset.code === panneau.code) b.classList.add("correct");
  });

  const fb = document.getElementById("feedback");

  if (isCorrect) {
    scoreOk++;
    btn.classList.add("correct");
    fb.className = "feedback correct show";
    fb.innerHTML = `✅ Bonne réponse ! <strong>${panneau.nom}</strong> — ${getDescription(panneau.code)}`;
  } else {
    scoreKo++;
    btn.classList.add("wrong");
    fb.className = "feedback wrong show";
    fb.innerHTML = `❌ Raté ! La bonne réponse était <strong>${panneau.nom}</strong>. ${getDescription(panneau.code)}`;
  }

  updateScoreboard();
  document.getElementById("btn-next").classList.add("show");
}

function getDescription(code) {
  const p = panneauxData.find(x => x.code === code);
  return p && p.description ? p.description : "";
}

// ── QUESTION SUIVANTE ─────────────────────────────────────────────────
function nextQuestion() {
  currentIndex++;
  if (currentIndex >= TOTAL_QUESTIONS) {
    showResults();
  } else {
    renderQuestion();
  }
}

// ── RÉSULTATS ─────────────────────────────────────────────────────────
function showResults() {
  document.getElementById("question-card").style.display = "none";
  document.getElementById("progress-fill").style.width = "100%";

  const pct = Math.round((scoreOk / TOTAL_QUESTIONS) * 100);
  let msg = "";
  if (pct === 100) msg = "Score parfait ! Vous êtes prêt(e) pour l'examen 🎉";
  else if (pct >= 70) msg = "Très bien ! Continuez à vous entraîner pour viser le sans-faute.";
  else if (pct >= 50) msg = "Pas mal, mais il reste des notions à réviser. Recommencez !";
  else msg = "Il faut reprendre l'étude des panneaux. Courage, vous y arriverez !";

  document.getElementById("final-score").textContent = scoreOk;
  document.getElementById("final-out-of").textContent = `/ ${TOTAL_QUESTIONS}`;
  document.getElementById("results-message").textContent = msg;
  document.getElementById("results-screen").classList.add("show");
}

// ── SCORE DISPLAY ─────────────────────────────────────────────────────
function updateScoreboard() {
  document.getElementById("score-correct").textContent = scoreOk;
  document.getElementById("score-wrong").textContent   = scoreKo;
}

// ── LANCEMENT ─────────────────────────────────────────────────────────
startQuiz();
</script>
</body>
</html>
