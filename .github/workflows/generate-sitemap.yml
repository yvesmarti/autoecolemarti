name: Generate Sitemap

on:
  push:
    branches: [main, master]
    paths:
      - '**.html'
      - '.github/workflows/generate-sitemap.yml'
  workflow_dispatch:  # Permet de lancer manuelle

jobs:
  sitemap:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Permettre de commit les changements

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Avoir l'historique complet pour git log

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Commit sitemap changes
        run: |
          if git diff --quiet sitemap.xml; then
            echo "✓ Sitemap inchangé, aucun commit nécessaire"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "docs: update sitemap.xml [skip ci]"
            git push
            echo "✓ Sitemap mis à jour et pushé"
          fi
